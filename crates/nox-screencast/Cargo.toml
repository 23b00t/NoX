[package]
name = "nox-screencast"
version = "0.1.0"
description = "Screen sharing from dom0 into VMs: dom0's cast helper, the VMs' portal backend and their session-bus bridge"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
blocking = "1"
serde_json = "1"
libc = "0.2"
pipewire = { version = "0.8", features = ["v0_3_34"] }
gstreamer = "0.23"
gstreamer-app = "0.23"
gstreamer-video = "0.23"
